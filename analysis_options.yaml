# Configuración del analizador. `flutter analyze` debe quedar sin avisos.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Futures sin await y BuildContext tras await fueron el origen de varios
    # bugs (setState tras dispose, errores sin capturar).
    unawaited_futures: warning
    use_build_context_synchronously: warning
    cancel_subscriptions: warning
    close_sinks: warning

linter:
  rules:
    - unawaited_futures
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks
    - avoid_print
    - always_declare_return_types
    - prefer_final_locals
